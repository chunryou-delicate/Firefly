[project]
name = "flysim"
version = "0.0.1"
description = "MaleCNS v1.0 connectome LIF simulator"
requires-python = ">=3.10"
dependencies = [
  "pyarrow>=17",
  "pandas>=2.2",
  "numpy>=1.26",
  "torch>=2.4",
  "pytest>=8",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flysim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ROS (/opt/ros) on PYTHONPATH registers a pytest plugin that fails to import
# without pyyaml. Block it so `pytest` works from a ROS-sourced shell.
addopts = "-p no:launch_testing -p no:launch_ros"
